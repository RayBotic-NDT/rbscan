# ==============================================================================
# GitLab CI/CD Pipeline for rbscan (RayBotic Scan Data Format)
# ==============================================================================
# Stages:
#   1. lint     - clang-format check, release tag matches the CMake version
#   2. build    - CMake Release build (C++ shared library, CLI tool, tests)
#   3. test     - C++ GoogleTest + Python pytest suite via CTest (JUnit report)
#   4. package  - C++ SDK (DLLs/.so, headers, CMake config, licenses), a build of
#                 a separate project against that SDK, and Python wheels.
#                 Published to the GitLab Generic Package Registry
#                 (packages/generic/rbscan/<version>/) on the default branch
#                 (<version>-dev.<sha>) and on release tags (<version>).
#   5. release  - GitLab release for a tag, notes from CHANGELOG.md
#   6. publish  - wheels + sdist to PyPI on a tag (Trusted Publishing, no
#                 stored token); TestPyPI by hand (manual job)
#
# Linux jobs run in the manylinux_2_28 image, so the wheels can be repaired
# into manylinux wheels that PyPI accepts.
#
# Windows jobs run on the runner tagged $RBSCAN_WINDOWS_RUNNER_TAG, Linux jobs
# on the one tagged $RBSCAN_LINUX_RUNNER_TAG. Leave RBSCAN_LINUX_RUNNER_TAG
# empty (CI/CD variable or "Run pipeline" form) to skip the Linux jobs.
#
# Releasing: set the version in CMakeLists.txt, add it to CHANGELOG.md, merge
# to main and push the tag v<version>.
# ==============================================================================

stages:
  - lint
  - build
  - test
  - package
  - release
  - publish

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"

variables:
  RBSCAN_WINDOWS_RUNNER_TAG: "raybot1"
  RBSCAN_LINUX_RUNNER_TAG: "raybot-linux"
  # Keep .deps/ (prebuilt HDF5 + zlib, uv + Python toolchain) and build trees
  # across jobs; tag pipelines still build from scratch.
  GIT_CLEAN_FLAGS: "none"
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: "safe.directory"
  GIT_CONFIG_VALUE_0: "*"
  # uv is installed into .deps/uv at exactly this version.
  UV_VERSION: "0.12.5"
  # Python versions for which wheels are built in the package stage (via uv)
  RBSCAN_WHEEL_PYTHONS: "3.11 3.12 3.13 3.14"

.windows:
  tags:
    - $RBSCAN_WINDOWS_RUNNER_TAG

.linux:
  image: quay.io/pypa/manylinux_2_28_x86_64
  tags:
    - $RBSCAN_LINUX_RUNNER_TAG
  rules:
    - if: $RBSCAN_LINUX_RUNNER_TAG

# ------------------------------------------------------------------
# Shared: uv (pinned) + .venv (with Python headers, numpy, pybind11, pytest, h5py, hdf5plugin)
# ------------------------------------------------------------------
# The GitLab Runner service runs as LocalSystem, where user-installed uv/Python
# are not in the PATH. uv is installed into .deps/uv inside the workspace.
.setup_python: &setup_python |
  $ErrorActionPreference = "Stop"
  $uvExe = "$PWD/.deps/uv/uv.exe"
  $uvHave = if (Test-Path $uvExe) { (& $uvExe --version).Split(' ')[1] } else { "" }
  if ($uvHave -ne $env:UV_VERSION) {
    Write-Host "Installing uv $env:UV_VERSION into $PWD/.deps/uv..."
    $env:UV_INSTALL_DIR = "$PWD/.deps/uv"
    $env:UV_NO_MODIFY_PATH = "1"
    irm "https://astral.sh/uv/$env:UV_VERSION/install.ps1" | iex
  }
  $env:PATH = "$PWD/.deps/uv;$env:PATH"
  $env:UV_PYTHON_INSTALL_DIR = "$PWD/.deps/uv-python"
  $env:UV_CACHE_DIR = "$PWD/.deps/uv-cache"

  $venvPython = "$PWD/.venv/Scripts/python.exe"
  if (-not (Test-Path $venvPython)) {
    Write-Host "Creating .venv with Python 3.12 via uv..."
    uv venv --python 3.12 .venv
    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  }
  uv pip install --python $venvPython "pybind11>=3.0" "numpy>=1.24" "pytest>=8" "h5py>=3.10" "hdf5plugin>=4.4"
  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  $cmakePython = ($venvPython -replace '\\', '/')
  Write-Host "Using Python for CMake: $cmakePython"

# Package version: the one in CMakeLists.txt; on a tag the tag must match it,
# elsewhere <version>-dev.<short sha>.
.release_version: &release_version |
  $cmakeVersion = (Select-String -Path CMakeLists.txt -Pattern '^\s+VERSION ([0-9]+\.[0-9]+\.[0-9]+)' | Select-Object -First 1).Matches[0].Groups[1].Value
  if ($env:CI_COMMIT_TAG) {
    if (($env:CI_COMMIT_TAG -replace '^v', '') -ne $cmakeVersion) {
      Write-Error "Tag $env:CI_COMMIT_TAG does not match the version $cmakeVersion in CMakeLists.txt"
      exit 1
    }
    $version = $cmakeVersion
  } else {
    $version = "$cmakeVersion-dev.$env:CI_COMMIT_SHORT_SHA"
  }
  Write-Host "Package version: $version"

.configure_windows: &configure_windows |
  cmake -B build -S . -G "Visual Studio 17 2022" -A x64 `
    -UPython* `
    "-DPython_EXECUTABLE=$cmakePython" `
    -DRBSCAN_BUILD_TESTS=ON `
    -DRBSCAN_BUILD_PYTHON=ON `
    -DRBSCAN_BUILD_EXAMPLES=ON `
    -DRBSCAN_BUILD_TOOLS=ON `
    -DRBSCAN_WARNINGS_AS_ERRORS=ON
  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  cmake --build build --config Release --parallel
  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

# ------------------------------------------------------------------
# Stage: Lint & Version Check
# ------------------------------------------------------------------
lint:clang-format:
  extends: .windows
  stage: lint
  script:
    - |
      $clangFormat = Get-Command clang-format -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
      if (-not $clangFormat) {
        $searchPaths = @(
          "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Tools\Llvm\x64\bin\clang-format.exe",
          "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Tools\Llvm\bin\clang-format.exe",
          "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Tools\Llvm\x64\bin\clang-format.exe",
          "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Tools\Llvm\bin\clang-format.exe",
          "C:\Program Files\LLVM\bin\clang-format.exe"
        )
        foreach ($p in $searchPaths) {
          if (Test-Path $p) {
            $clangFormat = $p
            break
          }
        }
      }
      if (-not $clangFormat) {
        Write-Error "clang-format not found on the runner (install the VS 'C++ Clang tools' or LLVM)."
        exit 1
      }
      Write-Host "Using clang-format from: $clangFormat"
      & $clangFormat --version
      $files = Get-ChildItem -Path src, include, tools, examples, tests, python -Include *.h, *.cpp, *.hpp -Recurse
      $failedFiles = @()
      foreach ($file in $files) {
        $output = & $clangFormat --dry-run --Werror $file.FullName 2>&1
        if ($LASTEXITCODE -ne 0) {
          Write-Host "Formatting violation in: $($file.FullName)"
          $failedFiles += $file.FullName
        }
      }
      if ($failedFiles.Count -gt 0) {
        Write-Error "Found $($failedFiles.Count) files with clang-format style violations."
        exit 1
      }
      Write-Host "All C++ files are compliant with .clang-format."

lint:version:
  extends: .windows
  stage: lint
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - *release_version
    - |
      $heading = "## [$version]"
      if (-not (Select-String -Path CHANGELOG.md -SimpleMatch $heading -Quiet)) {
        Write-Error "CHANGELOG.md has no section '$heading'"
        exit 1
      }

# ------------------------------------------------------------------
# Stage: Build Release Binaries
# ------------------------------------------------------------------
build:windows:
  extends: .windows
  stage: build
  script:
    - *setup_python
    - |
      $ErrorActionPreference = "Stop"
      Stop-Process -Name "rbscan", "rbscan_tests", "rbscan_record_ct_scan", "rbscan_read_benchmark" -Force -ErrorAction SilentlyContinue
      # Release tags always start from a clean build tree.
      if ($env:CI_COMMIT_TAG -and (Test-Path build)) { Remove-Item -Path build -Recurse -Force }
    - *configure_windows

build:linux:
  extends: .linux
  stage: build
  needs: []
  script:
    - ci/linux.sh build

# ------------------------------------------------------------------
# Stage: Execute CTest Suite & Export JUnit Report
# ------------------------------------------------------------------
test:windows:
  extends: .windows
  stage: test
  needs:
    - build:windows
  script:
    - *setup_python
    - |
      $ErrorActionPreference = "Stop"
      if (-not (Test-Path "build/bin/Release/rbscan.dll")) {
        Write-Error "No Release build in build/ (build:windows must run on this runner first)"
        exit 1
      }
      ctest --test-dir build -C Release --output-on-failure --output-junit ctest_report.xml
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      junit: build/ctest_report.xml

test:linux:
  extends: .linux
  stage: test
  needs:
    - build:linux
  script:
    - ci/linux.sh test
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      junit: build-linux/ctest_report.xml

# ------------------------------------------------------------------
# Stage: Package SDK & Python Wheels, publish to the Package Registry
# ------------------------------------------------------------------
package:windows:
  extends: .windows
  stage: package
  needs:
    - build:windows
    - test:windows
  script:
    - *setup_python
    - *release_version
    - |
      $ErrorActionPreference = "Stop"
      if (-not (Test-Path "build/bin/Release/rbscan.dll")) {
        Write-Error "No Release build in build/ (build:windows must run on this runner first)"
        exit 1
      }

      # Clean previous packaging output (workspace persists on runner)
      if (Test-Path "dist") { Remove-Item -Path "dist" -Recurse -Force }
      New-Item -ItemType Directory -Path "dist/dll", "dist/wheels", "dist/sdk" -Force | Out-Null

      # 1. Install the C++ SDK (rbscan.dll, rbscan_hdf5.dll, rbscan.exe, rbscan.lib,
      #    headers, CMake package config, embedded schemas and licenses)
      cmake --install build --config Release --component sdk --prefix dist/sdk
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # A separate project must find and use the installed SDK.
      if (Test-Path "build/consumer") { Remove-Item -Path "build/consumer" -Recurse -Force }
      cmake -S tests/consumer -B build/consumer -G "Visual Studio 17 2022" -A x64 "-DCMAKE_PREFIX_PATH=$PWD/dist/sdk"
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      cmake --build build/consumer --config Release
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      & build/consumer/Release/rbscan_consumer.exe build
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Copy the DLLs, import lib, and CLI executable to dist/dll/ for direct access
      Copy-Item -Path "dist/sdk/bin/rbscan.dll"      -Destination "dist/dll/" -Force
      Copy-Item -Path "dist/sdk/bin/rbscan_hdf5.dll" -Destination "dist/dll/" -Force
      Copy-Item -Path "dist/sdk/bin/rbscan.exe"      -Destination "dist/dll/" -Force
      Copy-Item -Path "dist/sdk/lib/rbscan.lib"      -Destination "dist/dll/" -Force

      # Also bundle the full C++ SDK into a single archive
      Compress-Archive -Path "dist/sdk/*" -DestinationPath "dist/rbscan-sdk-win64.zip" -Force
      Remove-Item -Path "dist/sdk" -Recurse -Force

      # 2. Build Python wheels (reuses prebuilt HDF5 in .deps/)
      $versions = ($env:RBSCAN_WHEEL_PYTHONS -split '\s+') | Where-Object { $_ }
      foreach ($py in $versions) {
        Write-Host "Building Python wheel for Python $py..."
        uv build --wheel --python $py -o dist/wheels
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Failed to build wheel for Python $py"
          exit $LASTEXITCODE
        }
      }
      Remove-Item -Path "dist/wheels/.gitignore" -Force -ErrorAction SilentlyContinue

      $wheels = Get-ChildItem -Path "dist/wheels" -Filter "*.whl"
      if (-not $wheels) {
        Write-Error "No Python wheels were built in dist/wheels"
        exit 1
      }

      # Smoke-test the Python 3.12 wheel in an isolated environment
      $testWheel = $wheels | Where-Object { $_.Name -match '-cp312-' } | Select-Object -First 1
      if ($testWheel) {
        Write-Host "Smoke-testing wheel $($testWheel.Name)..."
        uv run --isolated --no-project --python 3.12 --with $testWheel.FullName --with pytest --with h5py --with hdf5plugin pytest python/tests
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      }

      Write-Host "=== Packaged Artifacts ==="
      Get-ChildItem -Path "dist" -Recurse -File | ForEach-Object {
        Write-Host ("  {0} ({1:N1} KB)" -f $_.FullName.Substring($PWD.Path.Length + 1), ($_.Length / 1KB))
      }

      # 3. Publish SDK archive, DLLs, and Python wheels to the GitLab Generic Package Registry
      #    on the default branch and on release tags (packages/generic/rbscan/<version>/...).
      if ($env:CI_COMMIT_TAG -or ($env:CI_COMMIT_BRANCH -eq $env:CI_DEFAULT_BRANCH)) {
        $filesToPublish = @()
        $filesToPublish += Get-Item "dist/rbscan-sdk-win64.zip"
        $filesToPublish += Get-ChildItem -Path "dist/dll" -File
        $filesToPublish += Get-ChildItem -Path "dist/wheels" -Filter "*.whl"

        foreach ($file in $filesToPublish) {
          $url = "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/packages/generic/rbscan/$version/$($file.Name)"
          Write-Host "Publishing $($file.Name) ($([math]::Round($file.Length / 1KB, 1)) KB) to $url ..."
          $status = curl.exe --fail --silent --show-error --header "JOB-TOKEN: $env:CI_JOB_TOKEN" --upload-file $file.FullName --write-out "%{http_code}" $url
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Upload of $($file.Name) to the Generic Package Registry failed (HTTP $status, curl exit code $LASTEXITCODE)"
            exit 1
          }
          Write-Host "Published: $url"
        }
      }
  artifacts:
    name: "rbscan-windows-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 30 days
    paths:
      - "dist/dll/rbscan.dll"
      - "dist/dll/rbscan_hdf5.dll"
      - "dist/dll/rbscan.lib"
      - "dist/dll/rbscan.exe"
      - "dist/rbscan-sdk-win64.zip"
      - "dist/wheels/*.whl"

package:linux:
  extends: .linux
  stage: package
  needs:
    - build:linux
    - test:linux
  script:
    - ci/linux.sh version
    - ci/linux.sh package
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ] || [ "${CI_COMMIT_BRANCH:-}" = "$CI_DEFAULT_BRANCH" ]; then
        ci/linux.sh publish
      fi
  artifacts:
    name: "rbscan-linux-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 30 days
    paths:
      - "dist/rbscan-sdk-linux-x86_64.tar.gz"
      - "dist/rbscan-[0-9]*.tar.gz"
      - "dist/wheels/*.whl"

# ------------------------------------------------------------------
# Stage: GitLab Release (tags only)
# ------------------------------------------------------------------
release:
  extends: .windows
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: package:windows
      artifacts: true
    - job: package:linux
      artifacts: true
      optional: true
  script:
    - *release_version
    - |
      $ErrorActionPreference = "Stop"
      # Release notes: the CHANGELOG.md section of this version.
      $notes = @()
      $inSection = $false
      foreach ($line in Get-Content CHANGELOG.md -Encoding UTF8) {
        if ($line -like "## *") {
          if ($inSection) { break }
          $inSection = $line.StartsWith("## [$version]")
          continue
        }
        if ($inSection) { $notes += $line }
      }
      $packageUrl = "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/packages/generic/rbscan/$version"
      $files = @(Get-Item "dist/rbscan-sdk-*" -ErrorAction SilentlyContinue) + @(Get-ChildItem "dist/wheels" -Filter "*.whl" -ErrorAction SilentlyContinue)
      $links = @($files | ForEach-Object {
        @{ name = $_.Name; url = "$packageUrl/$($_.Name)"; link_type = "package" }
      })
      $body = @{
        tag_name = $env:CI_COMMIT_TAG
        name = "rbscan $version"
        description = ($notes -join "`n").Trim()
        assets = @{ links = $links }
      } | ConvertTo-Json -Depth 5
      $bodyFile = Join-Path $env:TEMP "rbscan-release.json"
      [System.IO.File]::WriteAllText($bodyFile, $body, (New-Object System.Text.UTF8Encoding $false))
      curl.exe --fail --silent --show-error --header "JOB-TOKEN: $env:CI_JOB_TOKEN" --header "Content-Type: application/json" --data "@$bodyFile" "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/releases"
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      Write-Host "`nCreated release rbscan $version with $($links.Count) package links"

# ------------------------------------------------------------------
# Stage: Publish to PyPI / TestPyPI (Trusted Publishing)
# ------------------------------------------------------------------
# PyPI trusts this project's GitLab OIDC token (pending/trusted publisher:
# namespace raybotic/machine, project rbscan, workflow .gitlab-ci.yml,
# environment pypi resp. testpypi). The job swaps the token for a short-lived
# upload token; nothing is stored in CI/CD variables. PyPI accepts every
# version only once.
.pypi_upload:
  extends: .linux
  image: python:3.12-slim
  variables:
    # Before the artifacts arrive: drop old dist/ files, keep the build caches.
    GIT_CLEAN_FLAGS: "-ffdx -e .deps -e .venv -e build-linux"
  needs:
    - job: package:windows
      artifacts: true
    - job: package:linux
      artifacts: true
  script:
    - python -m pip install --quiet --upgrade twine
    - ls -l dist dist/wheels
    - python -m twine check --strict dist/wheels/*.whl dist/rbscan-[0-9]*.tar.gz
    - |
      api_token=$(python - <<'PY'
      import json, os, urllib.request
      req = urllib.request.Request(
          os.environ["PYPI_MINT_URL"],
          data=json.dumps({"token": os.environ["PYPI_ID_TOKEN"]}).encode(),
          headers={"Content-Type": "application/json"},
          method="POST",
      )
      try:
          with urllib.request.urlopen(req) as r:
              print(json.load(r)["token"])
      except urllib.error.HTTPError as e:
          raise SystemExit(f"minting the upload token failed: {e.code} {e.read().decode()}")
      PY
      ) || exit 1
    - python -m twine upload --non-interactive --repository-url "$PYPI_UPLOAD_URL" $TWINE_EXTRA -u __token__ -p "$api_token" dist/wheels/*.whl dist/rbscan-[0-9]*.tar.gz

publish:testpypi:
  extends: .pypi_upload
  stage: publish
  environment: testpypi
  id_tokens:
    PYPI_ID_TOKEN:
      aud: testpypi
  variables:
    PYPI_MINT_URL: "https://test.pypi.org/_/oidc/mint-token"
    PYPI_UPLOAD_URL: "https://test.pypi.org/legacy/"
    # A trial run may repeat a version that is already there.
    TWINE_EXTRA: "--skip-existing"
  rules:
    - if: $RBSCAN_LINUX_RUNNER_TAG == null || $RBSCAN_LINUX_RUNNER_TAG == ""
      when: never
    - if: $CI_COMMIT_TAG || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true

publish:pypi:
  extends: .pypi_upload
  stage: publish
  environment: pypi
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
  variables:
    PYPI_MINT_URL: "https://pypi.org/_/oidc/mint-token"
    PYPI_UPLOAD_URL: "https://upload.pypi.org/legacy/"
    TWINE_EXTRA: ""
  rules:
    - if: $RBSCAN_LINUX_RUNNER_TAG == null || $RBSCAN_LINUX_RUNNER_TAG == ""
      when: never
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
