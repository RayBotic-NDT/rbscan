# ==============================================================================
# GitLab CI/CD Pipeline for rbscan (RayBotic Scan Data Format)
# ==============================================================================
# Stages:
#   1. lint     - Clang-format code style verification
#   2. build    - CMake Release build (C++ shared library, CLI tool, tests)
#   3. test     - C++ GoogleTest + Python pytest suite via CTest (JUnit report)
#   4. package  - C++ DLLs / SDK (rbscan.dll, rbscan_hdf5.dll, rbscan.lib,
#                 headers, CMake config) and Python wheels (*.whl) exposed
#                 as GitLab CI Job Artifacts and published to the GitLab
#                 Generic Package Registry (packages/generic/rbscan/<version>/).
# ==============================================================================

stages:
  - lint
  - build
  - test
  - package

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"

default:
  tags:
    - raybot1

variables:
  # Keep .deps/ (prebuilt HDF5 + zlib) and build trees across jobs on the runner
  GIT_CLEAN_FLAGS: "none"
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: "safe.directory"
  GIT_CONFIG_VALUE_0: "*"
  # Python versions for which wheels are built in the package stage ( via uv )
  RBSCAN_WHEEL_PYTHONS: "3.11 3.12 3.13 3.14"
  CMAKE_CONFIGURE_ARGS: >-
    -G "Visual Studio 17 2022" -A x64
    -DRBSCAN_BUILD_TESTS=ON
    -DRBSCAN_BUILD_PYTHON=ON
    -DRBSCAN_BUILD_EXAMPLES=ON
    -DRBSCAN_BUILD_TOOLS=ON
    -DRBSCAN_WARNINGS_AS_ERRORS=ON

# ------------------------------------------------------------------
# Stage: Lint & Code Formatting Check
# ------------------------------------------------------------------
lint:clang-format:
  stage: lint
  script:
    - |
      $clangFormat = Get-Command clang-format -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
      if (-not $clangFormat) {
        $searchPaths = @(
          "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Tools\Llvm\x64\bin\clang-format.exe",
          "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Tools\Llvm\bin\clang-format.exe",
          "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Tools\Llvm\x64\bin\clang-format.exe",
          "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Tools\Llvm\bin\clang-format.exe",
          "C:\Program Files\LLVM\bin\clang-format.exe"
        )
        foreach ($p in $searchPaths) {
          if (Test-Path $p) {
            $clangFormat = $p
            break
          }
        }
      }
      if (-not $clangFormat) {
        Write-Warning "clang-format not found; skipping lint step."
        exit 0
      }
      Write-Host "Using clang-format from: $clangFormat"
      $files = Get-ChildItem -Path src, include, tools, examples, tests, python -Include *.h, *.cpp, *.hpp -Recurse | Where-Object { $_.FullName -notmatch '\\build\\' -and $_.FullName -notmatch '\\dist\\' }
      $failedFiles = @()
      foreach ($file in $files) {
        $output = & $clangFormat --dry-run --Werror $file.FullName 2>&1
        if ($LASTEXITCODE -ne 0) {
          Write-Host "Formatting violation in: $($file.FullName)"
          $failedFiles += $file.FullName
        }
      }
      if ($failedFiles.Count -gt 0) {
        Write-Error "Found $($failedFiles.Count) files with clang-format style violations."
        exit 1
      }
      Write-Host "All C++ files are compliant with .clang-format."

# ------------------------------------------------------------------
# Stage: Build Release Binaries
# ------------------------------------------------------------------
build:windows:
  stage: build
  script:
    - |
      $ErrorActionPreference = "Stop"
      Stop-Process -Name "rbscan", "rbscan_tests", "rbscan_record_ct_scan", "rbscan_read_benchmark" -Force -ErrorAction SilentlyContinue
      $pyArg = @()
      if (Test-Path ".venv/Scripts/python.exe") {
        $pyArg = @("-DPython_EXECUTABLE=$PWD/.venv/Scripts/python.exe")
      }
      cmake -B build -S . -G "Visual Studio 17 2022" -A x64 `
        -DRBSCAN_BUILD_TESTS=ON `
        -DRBSCAN_BUILD_PYTHON=ON `
        -DRBSCAN_BUILD_EXAMPLES=ON `
        -DRBSCAN_BUILD_TOOLS=ON `
        -DRBSCAN_WARNINGS_AS_ERRORS=ON `
        @pyArg
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      cmake --build build --config Release --parallel
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

# ------------------------------------------------------------------
# Stage: Execute CTest Suite & Export JUnit Report
# ------------------------------------------------------------------
test:windows:
  stage: test
  needs:
    - build:windows
  script:
    - |
      $ErrorActionPreference = "Stop"
      if (-not (Test-Path "build/bin/Release/rbscan.dll")) {
        cmake -B build -S . -G "Visual Studio 17 2022" -A x64 `
          -DRBSCAN_BUILD_TESTS=ON `
          -DRBSCAN_BUILD_PYTHON=ON `
          -DRBSCAN_BUILD_EXAMPLES=ON `
          -DRBSCAN_BUILD_TOOLS=ON `
          -DRBSCAN_WARNINGS_AS_ERRORS=ON
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        cmake --build build --config Release --parallel
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      }
      ctest --test-dir build -C Release --output-on-failure --output-junit ctest_report.xml
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      junit: build/ctest_report.xml

# ------------------------------------------------------------------
# Stage: Package DLLs, C++ SDK & Python Wheels as Job Artifacts
# ------------------------------------------------------------------
package:artifacts:
  stage: package
  needs:
    - build:windows
    - test:windows
  script:
    - |
      $ErrorActionPreference = "Stop"
      if (-not (Test-Path "build/bin/Release/rbscan.dll")) {
        cmake -B build -S . -G "Visual Studio 17 2022" -A x64 `
          -DRBSCAN_BUILD_TESTS=OFF `
          -DRBSCAN_BUILD_PYTHON=OFF `
          -DRBSCAN_BUILD_EXAMPLES=OFF `
          -DRBSCAN_BUILD_TOOLS=ON
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        cmake --build build --config Release --parallel
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      }

      # Clean previous packaging output (workspace persists on runner)
      if (Test-Path "dist") { Remove-Item -Path "dist" -Recurse -Force }
      New-Item -ItemType Directory -Path "dist/dll", "dist/wheels", "dist/sdk" -Force | Out-Null

      # 1. Install the C++ SDK (rbscan.dll, rbscan_hdf5.dll, rbscan.exe, rbscan.lib,
      #    headers, CMake package config, and embedded schemas)
      cmake --install build --config Release --component sdk --prefix dist/sdk
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Copy the DLLs, import lib, and CLI executable to dist/dll/ for direct access
      Copy-Item -Path "dist/sdk/bin/rbscan.dll"      -Destination "dist/dll/" -Force
      Copy-Item -Path "dist/sdk/bin/rbscan_hdf5.dll" -Destination "dist/dll/" -Force
      Copy-Item -Path "dist/sdk/bin/rbscan.exe"      -Destination "dist/dll/" -Force
      Copy-Item -Path "dist/sdk/lib/rbscan.lib"      -Destination "dist/dll/" -Force

      # Also bundle the full C++ SDK into a single archive
      Compress-Archive -Path "dist/sdk/*" -DestinationPath "dist/rbscan-sdk-win64.zip" -Force
      Remove-Item -Path "dist/sdk" -Recurse -Force

      # 2. Build Python wheels (reuses prebuilt HDF5 in .deps/)
      $uv = Get-Command uv -ErrorAction SilentlyContinue
      if ($uv) {
        $versions = ($env:RBSCAN_WHEEL_PYTHONS -split '\s+') | Where-Object { $_ }
        foreach ($py in $versions) {
          Write-Host "Building Python wheel for Python $py..."
          uv build --wheel --python $py -o dist/wheels
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to build wheel for Python $py"
            exit $LASTEXITCODE
          }
        }
      } else {
        Write-Host "uv not found; building wheel with default Python..."
        python -m pip wheel . --no-deps -w dist/wheels
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      }
      Remove-Item -Path "dist/wheels/.gitignore" -Force -ErrorAction SilentlyContinue

      $wheels = Get-ChildItem -Path "dist/wheels" -Filter "*.whl"
      if (-not $wheels) {
        Write-Error "No Python wheels were built in dist/wheels"
        exit 1
      }

      # Smoke-test the latest built wheel in an isolated environment
      if ($uv) {
        $latestWheel = $wheels | Sort-Object Name -Descending | Select-Object -First 1
        Write-Host "Smoke-testing wheel $($latestWheel.Name)..."
        uv run --isolated --no-project --with $latestWheel.FullName --with pytest --with h5py pytest python/tests
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      }

      Write-Host "=== Packaged Artifacts ==="
      Get-ChildItem -Path "dist" -Recurse -File | ForEach-Object {
        Write-Host ("  {0} ({1:N1} KB)" -f $_.FullName.Substring($PWD.Path.Length + 1), ($_.Length / 1KB))
      }

      # 3. Publish SDK archive, DLLs, and Python wheels to the GitLab Generic Package Registry
      #    on the default branch and on release tags (packages/generic/rbscan/<version>/...).
      if ($env:CI_COMMIT_TAG -or ($env:CI_COMMIT_BRANCH -eq $env:CI_DEFAULT_BRANCH)) {
        $version = if ($env:CI_COMMIT_TAG) { $env:CI_COMMIT_TAG -replace '^v', '' } else { "0.0.0-$env:CI_COMMIT_SHORT_SHA" }
        $filesToPublish = @()
        $filesToPublish += Get-Item "dist/rbscan-sdk-win64.zip"
        $filesToPublish += Get-ChildItem -Path "dist/dll" -File
        $filesToPublish += Get-ChildItem -Path "dist/wheels" -Filter "*.whl"

        foreach ($file in $filesToPublish) {
          $url = "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/packages/generic/rbscan/$version/$($file.Name)"
          Write-Host "Publishing $($file.Name) ($([math]::Round($file.Length / 1KB, 1)) KB) to $url ..."
          $status = curl.exe --fail --silent --show-error --header "JOB-TOKEN: $env:CI_JOB_TOKEN" --upload-file $file.FullName --write-out "%{http_code}" $url
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Upload of $($file.Name) to the Generic Package Registry failed (HTTP $status, curl exit code $LASTEXITCODE)"
            exit 1
          }
          Write-Host "Published: $url"
        }
      }
  artifacts:
    name: "rbscan-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 30 days
    paths:
      - "dist/dll/rbscan.dll"
      - "dist/dll/rbscan_hdf5.dll"
      - "dist/dll/rbscan.lib"
      - "dist/dll/rbscan.exe"
      - "dist/rbscan-sdk-win64.zip"
      - "dist/wheels/*.whl"
